<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kundenbewertungen – Fulfillbridge</title>
  <meta name="description" content="Was Kunden über Fulfillbridge sagen – alle Bewertungen zur 3PL-Vermittlung im DACH-Raum." />
  <link rel="canonical" href="https://fulfillbridge.de/bewertungen" />
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#08080d;--surface:#0f0f16;--card:#13131c;--border:#22222e;--accent:#5bffc8;--accent2:#3de0a8;--text:#c8c8e0;--muted:#6b6b8a;--soft:#9494b8;--white:#f0f0fa;--fh:'Manrope',sans-serif;--fb:'Inter',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.75;overflow-x:hidden;}
    body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;z-index:0;}
    .glow{position:fixed;top:-400px;left:50%;transform:translateX(-50%);width:900px;height:900px;background:radial-gradient(ellipse,rgba(91,255,200,0.04) 0%,transparent 65%);pointer-events:none;z-index:0;}
    .wrap{max-width:1040px;margin:0 auto;padding:0 28px;position:relative;z-index:1;}
    nav{position:sticky;top:0;z-index:100;background:rgba(8,8,13,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1040px;margin:0 auto;padding:0 28px;}
    .logo{font-family:var(--fh);font-weight:800;font-size:1.1rem;color:var(--white);text-decoration:none;letter-spacing:-0.01em;}
    .logo span{color:var(--accent);}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:0.85rem;transition:color 0.2s;}
    .back-link:hover{color:var(--accent);}

    .page-header{padding:72px 0 52px;}
    .section-tag{display:block;font-size:0.7rem;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
    h1{font-family:var(--fh);font-size:clamp(1.8rem,3vw,2.6rem);font-weight:800;letter-spacing:-0.02em;color:var(--white);line-height:1.12;margin-bottom:16px;}
    .summary-row{display:flex;align-items:center;gap:14px;margin-bottom:48px;}
    .avg-big{font-family:var(--fh);font-size:2.8rem;font-weight:800;color:var(--white);line-height:1;}
    .avg-stars{color:var(--accent);font-size:1.15rem;letter-spacing:2px;}
    .avg-count{font-size:0.82rem;color:var(--muted);}

    .reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:80px;}
    .review-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color 0.2s;}
    .review-card:hover{border-color:rgba(91,255,200,0.15);}
    .review-card-stars{color:var(--accent);font-size:0.95rem;letter-spacing:2px;}
    .review-card-text{font-size:0.855rem;color:var(--soft);line-height:1.75;flex:1;}
    .review-card-meta{font-size:0.75rem;color:var(--muted);}
    .reviews-empty{font-size:0.9rem;color:var(--muted);padding:40px 0;}
    .reviews-loading{font-size:0.85rem;color:var(--muted);padding:24px 0;}

    .btn-review{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--accent);padding:10px 20px;border-radius:8px;font-family:var(--fh);font-weight:700;font-size:0.85rem;text-decoration:none;border:1px solid rgba(91,255,200,0.35);cursor:pointer;transition:background 0.2s,border-color 0.2s;}
    .btn-review:hover{background:rgba(91,255,200,0.07);border-color:var(--accent);}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--card);border:1px solid rgba(91,255,200,0.18);border-radius:16px;padding:40px 36px;width:100%;max-width:460px;position:relative;animation:up .25s ease both;}
    .modal-close{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1;transition:color 0.2s;}
    .modal-close:hover{color:var(--white);}
    .modal h3{font-family:var(--fh);font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:6px;}
    .modal-sub{font-size:0.82rem;color:var(--muted);margin-bottom:28px;}
    .star-picker{display:flex;gap:8px;margin-bottom:22px;}
    .star-picker button{background:none;border:none;font-size:1.8rem;cursor:pointer;color:var(--border);transition:color 0.15s,transform 0.1s;line-height:1;padding:0;}
    .star-picker button.active{color:var(--accent);}
    .star-picker button:hover{transform:scale(1.15);}
    .modal textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--fb);font-size:0.88rem;padding:12px 14px;outline:none;width:100%;resize:vertical;min-height:110px;transition:border-color 0.2s;line-height:1.65;}
    .modal textarea:focus{border-color:rgba(91,255,200,0.4);}
    .modal textarea::placeholder{color:var(--muted);opacity:0.5;}
    .modal-name-row{margin-bottom:14px;}
    .modal-name-row input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--fb);font-size:0.88rem;padding:10px 14px;outline:none;width:100%;transition:border-color 0.2s;}
    .modal-name-row input:focus{border-color:rgba(91,255,200,0.4);}
    .modal-name-row input::placeholder{color:var(--muted);opacity:0.5;}
    .modal-label{font-size:0.7rem;font-weight:600;color:var(--muted);letter-spacing:0.07em;text-transform:uppercase;display:block;margin-bottom:6px;}
    .modal-submit{margin-top:18px;width:100%;background:var(--accent);color:#08080d;border:none;border-radius:8px;font-family:var(--fh);font-size:0.92rem;font-weight:700;padding:13px 24px;cursor:pointer;transition:background 0.2s,transform 0.15s;}
    .modal-submit:hover{background:var(--accent2);transform:translateY(-2px);}
    .modal-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
    .modal-msg{margin-top:12px;font-size:0.84rem;display:none;}

    footer{border-top:1px solid var(--border);padding:32px 0;}
    .footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
    .footer-inner p{font-size:0.8rem;color:var(--muted);}
    .footer-links{display:flex;gap:22px;}
    .footer-links a{font-size:0.8rem;color:var(--muted);text-decoration:none;transition:color 0.2s;}
    .footer-links a:hover{color:var(--soft);}

    @media(max-width:840px){.reviews-grid{grid-template-columns:1fr;}.modal{padding:28px 22px;}.summary-row{flex-wrap:wrap;}}
    @keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div class="glow"></div>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo">Fulfill<span>bridge</span></a>
    <a href="/" class="back-link">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Zurück zur Startseite
    </a>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="page-header">
      <span class="section-tag">Kundenstimmen</span>
      <h1>Was Kunden über Fulfillbridge sagen</h1>
      <div class="summary-row">
        <div class="avg-big" id="avg-score">–</div>
        <div>
          <div class="avg-stars" id="avg-stars"></div>
          <div class="avg-count" id="reviews-count">Lade Bewertungen…</div>
        </div>
        <button class="btn-review" onclick="openModal()" style="margin-left:auto;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Bewertung abgeben
        </button>
      </div>
      <div id="reviews-grid" class="reviews-grid">
        <div class="reviews-loading">Bewertungen werden geladen…</div>
      </div>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="review-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Deine Bewertung</h3>
    <p class="modal-sub">Wie war deine Erfahrung mit Fulfillbridge?</p>
    <div class="star-picker" id="star-picker">
      <button type="button" data-val="1" onclick="setStar(1)">★</button>
      <button type="button" data-val="2" onclick="setStar(2)">★</button>
      <button type="button" data-val="3" onclick="setStar(3)">★</button>
      <button type="button" data-val="4" onclick="setStar(4)">★</button>
      <button type="button" data-val="5" onclick="setStar(5)">★</button>
    </div>
    <div class="modal-name-row">
      <label class="modal-label" for="review-name">Dein Name (optional)</label>
      <input type="text" id="review-name" placeholder="z.B. Max M." />
    </div>
    <label class="modal-label" for="review-text">Deine Erfahrung</label>
    <textarea id="review-text" placeholder="Was hat Fulfillbridge für dich getan? Was hat besonders gut geklappt?"></textarea>
    <button class="modal-submit" id="review-submit-btn" onclick="submitReview()">Bewertung absenden →</button>
    <div class="modal-msg" id="review-msg"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <p>© 2026 Fulfillbridge &nbsp;·&nbsp; 3PL Vermittlung DACH</p>
      <div class="footer-links">
        <a href="/impressum">Impressum</a>
        <a href="/datenschutz">Datenschutz</a>
        <a href="https://www.linkedin.com/in/fulfillbridge-dach-8832b03a8/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </div>
</footer>

<script>
(function(){
  const TOKEN = 'patjpHLbe1Uo3tmk9.3151d7446c6249a3d1ec3e8ec1648d11d71ab4020e79228666efc84fd6ca320b';
  const BASE  = 'appNUDG6o23reR10C';
  const TABLE = 'Bewertungen';
  const API   = `https://api.airtable.com/v0/${BASE}/${encodeURIComponent(TABLE)}`;
  const HEAD  = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

  let selectedStar = 0;

  window.setStar = function(val) {
    selectedStar = val;
    document.querySelectorAll('#star-picker button').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.val) <= val);
    });
  };
  window.openModal = function() {
    document.getElementById('review-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeModal = function() {
    document.getElementById('review-modal').classList.remove('open');
    document.body.style.overflow = '';
  };
  window.handleOverlayClick = function(e) {
    if (e.target === document.getElementById('review-modal')) closeModal();
  };

  function starsStr(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  async function loadReviews() {
    const grid    = document.getElementById('reviews-grid');
    const avgEl   = document.getElementById('avg-score');
    const starsEl = document.getElementById('avg-stars');
    const countEl = document.getElementById('reviews-count');
    try {
      const r = await fetch(`${API}?sort%5B0%5D%5Bfield%5D=Datum&sort%5B0%5D%5Bdirection%5D=desc`, { headers: HEAD });
      if (!r.ok) throw new Error();
      const data = await r.json();
      const records = data.records || [];
      if (records.length === 0) {
        grid.innerHTML = '<div class="reviews-empty">Noch keine Bewertungen – sei der Erste!</div>';
        avgEl.textContent = '–'; starsEl.textContent = ''; countEl.textContent = '0 Bewertungen';
        return;
      }
      const total = records.reduce((s, rec) => s + (parseInt(rec.fields.Sterne) || 0), 0);
      const mean  = (total / records.length).toFixed(1);
      avgEl.textContent = mean;
      starsEl.textContent = starsStr(Math.round(parseFloat(mean)));
      countEl.textContent = `${records.length} Bewertung${records.length !== 1 ? 'en' : ''}`;
      grid.innerHTML = records.map(rec => {
        const f    = rec.fields;
        const n    = parseInt(f.Sterne) || 0;
        const name = f.Name || 'Anonym';
        const date = f.Datum ? new Date(f.Datum).toLocaleDateString('de-DE', { month: 'short', year: 'numeric' }) : '';
        const text = (f.Text || '').replace(/</g, '&lt;');
        return `<div class="review-card">
          <div class="review-card-stars">${starsStr(n)}</div>
          <div class="review-card-text">${text}</div>
          <div class="review-card-meta">${name}${date ? ' · ' + date : ''}</div>
        </div>`;
      }).join('');
    } catch(e) {
      grid.innerHTML = '<div class="reviews-empty">Bewertungen konnten nicht geladen werden.</div>';
      countEl.textContent = '';
    }
  }

  window.submitReview = async function() {
    const btn  = document.getElementById('review-submit-btn');
    const msg  = document.getElementById('review-msg');
    const text = document.getElementById('review-text').value.trim();
    const name = document.getElementById('review-name').value.trim();
    if (!selectedStar) { msg.style.display='block'; msg.style.color='#e57373'; msg.textContent='Bitte wähle zuerst eine Sternebewertung.'; return; }
    if (!text) { msg.style.display='block'; msg.style.color='#e57373'; msg.textContent='Bitte schreib kurz etwas zu deiner Erfahrung.'; return; }
    btn.disabled = true; btn.textContent = 'Wird gesendet…';
    msg.style.display = 'none';
    try {
      const body = { records: [{ fields: { Sterne: selectedStar, Text: text, Name: name || 'Anonym', Datum: new Date().toISOString().split('T')[0] } }] };
      const r = await fetch(API, { method: 'POST', headers: HEAD, body: JSON.stringify(body) });
      if (!r.ok) { const err = await r.json(); throw new Error(err.error?.message || 'Fehler'); }
      msg.style.display='block'; msg.style.color='var(--accent)';
      msg.textContent = '✓ Danke für deine Bewertung!';
      document.getElementById('review-text').value = '';
      document.getElementById('review-name').value = '';
      selectedStar = 0;
      document.querySelectorAll('#star-picker button').forEach(b => b.classList.remove('active'));
      setTimeout(() => { closeModal(); loadReviews(); }, 1400);
    } catch(e) {
      msg.style.display='block'; msg.style.color='#e57373';
      msg.textContent = 'Fehler beim Senden – bitte schreib uns direkt auf LinkedIn.';
    }
    btn.disabled = false; btn.textContent = 'Bewertung absenden →';
  };

  loadReviews();
})();
</script>
</body>
</html>
